# Blueprint de Render: crea el servicio web y la base de datos PostgreSQL gratuita
services:
  - type: web
    name: domotica-villa-la-paz
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: domotica-db
          property: connectionString

databases:
  - name: domotica-db
    plan: free
    databaseName: domotica

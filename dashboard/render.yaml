# Blueprint de Render: crea el servicio web y la base de datos PostgreSQL gratuita
services:
  - type: web
    name: domotica-villa-la-paz
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: API_KEY
        generateValue: true
      # PIN para armar la alarma y controlar el ventilador desde el panel (cámbialo en Render)
      - key: CONTROL_PIN
        value: "1234"
      # Tema de ntfy para los avisos al teléfono (cámbialo por uno difícil de adivinar)
      - key: NTFY_TOPIC
        value: villa-la-paz-alarma-cambiame
      - key: DATABASE_URL
        fromDatabase:
          name: domotica-db
          property: connectionString

databases:
  - name: domotica-db
    plan: free
    databaseName: domotica

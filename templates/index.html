<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Domótica Villa La Paz</title>
<meta name="description" content="Monitoreo remoto de sensores del sistema domótico, residencial Villa La Paz.">
<meta name="theme-color" content="#2a78d6">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<style>
  :root {
    color-scheme: light;
    --page: #f4f4f2;
    --surface-1: #fcfcfb;
    --border: #e2e1dc;
    --grid: #ecebe7;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7a7974;
    --series-1: #2a78d6;
    --good: #008300;
    --warn: #b36b00;
    --critical: #d03b3a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #111110;
      --surface-1: #1a1a19;
      --border: #2e2e2c;
      --grid: #262624;
      --text-primary: #f0efec;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8e86;
      --series-1: #3987e5;
      --good: #3fa34d;
      --warn: #d99a2b;
      --critical: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #111110; --surface-1: #1a1a19; --border: #2e2e2c; --grid: #262624;
    --text-primary: #f0efec; --text-secondary: #c3c2b7; --text-muted: #8f8e86;
    --series-1: #3987e5; --good: #3fa34d; --warn: #d99a2b; --critical: #e66767;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--page); color: var(--text-primary);
    font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  h1 { font-size: 20px; margin: 0; }
  .sub { color: var(--text-secondary); font-size: 13px; }
  .estado { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); }
  .punto { width: 9px; height: 9px; border-radius: 50%; background: var(--text-muted); }
  .punto.ok { background: var(--good); } .punto.viejo { background: var(--warn); } .punto.error { background: var(--critical); }
  .filtros { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-1); }
  .seg button { border: 0; background: none; color: var(--text-secondary); padding: 7px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--series-1); color: #fff; }
  select { font: inherit; font-size: 13px; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile, .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
  .tile .lbl { color: var(--text-secondary); font-size: 13px; }
  .tile .val { font-size: 28px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .tile .val small { font-size: 15px; font-weight: 400; color: var(--text-secondary); margin-left: 3px; }
  .tile .bin { font-size: 18px; font-weight: 600; margin-top: 6px; display: flex; align-items: center; gap: 6px; }
  .charts { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .card h2 { font-size: 14px; margin: 0 0 8px; font-weight: 600; }
  .card .cv { position: relative; height: 200px; }
  .vacio { background: var(--surface-1); border: 1px dashed var(--border); border-radius: 12px; padding: 24px; color: var(--text-secondary); text-align: center; }
  code { background: var(--grid); padding: 1px 5px; border-radius: 4px; }
  details { margin-top: 16px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--grid); }
  th { color: var(--text-secondary); font-weight: 600; }
  #instalar { display: none; border: 1px solid var(--series-1); color: var(--series-1); background: none; border-radius: 8px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer; }
  @media (max-width: 480px) { .charts { grid-template-columns: 1fr; } .tile .val { font-size: 24px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Sistema domótico · Villa La Paz</h1>
      <div class="sub">Monitoreo remoto de sensores de la ESP32</div>
    </div>
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
      <span class="estado"><span class="punto" id="punto"></span><span id="estadoTxt">Conectando…</span></span>
      <button id="instalar">Instalar app</button>
    </div>
  </header>

  <div class="filtros">
    <div class="seg" id="rango" role="group" aria-label="Rango de tiempo">
      <button data-h="1">1 h</button>
      <button data-h="6" aria-pressed="true">6 h</button>
      <button data-h="24">24 h</button>
      <button data-h="168">7 días</button>
    </div>
    <select id="dispositivo" aria-label="Dispositivo" hidden></select>
  </div>

  <div class="tiles" id="tiles"></div>
  <div class="charts" id="charts"></div>

  <details>
    <summary class="sub">Ver últimas lecturas en tabla</summary>
    <div class="card" style="margin-top:8px;overflow-x:auto"><table id="tabla"></table></div>
  </details>
</div>

<script src="/static/chart.umd.min.js"></script>
<script>
// Nombre, unidad y tipo de cada sensor. Si la ESP32 envía otro campo,
// el dashboard lo muestra igual con su nombre original.
const SENSORES = {
  temperatura: { nombre: "Temperatura", unidad: "°C", dec: 1 },
  humedad:     { nombre: "Humedad", unidad: "%", dec: 0 },
  luz:         { nombre: "Luz", unidad: "lx", dec: 0 },
  gas:         { nombre: "Gas", unidad: "ppm", dec: 0 },
  consumo:     { nombre: "Consumo eléctrico", unidad: "W", dec: 0 },
  movimiento:  { nombre: "Movimiento", binario: ["Sin movimiento", "Movimiento detectado"], corto: ["No", "Sí"] },
  puerta:      { nombre: "Puerta", binario: ["Cerrada", "Abierta"], corto: ["Cerrada", "Abierta"] },
  luz_sala:    { nombre: "Luz de la sala", binario: ["Apagada", "Encendida"], corto: ["Off", "On"] },
};
const REFRESCO_MS = 5000;

let horas = 6, dispositivo = null, graficas = {};
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const info = k => SENSORES[k] || { nombre: k.charAt(0).toUpperCase() + k.slice(1).replace(/_/g, " "), unidad: "", dec: 2 };
const fmtHora = ms => new Date(ms).toLocaleTimeString("es-NI", { hour: "2-digit", minute: "2-digit", hourCycle: "h23" });
const fmtFecha = ms => new Date(ms).toLocaleString("es-NI", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit", second: "2-digit" });

async function cargar() {
  try {
    const q = new URLSearchParams({ horas });
    if (dispositivo) q.set("dispositivo", dispositivo);
    const [hist, ult] = await Promise.all([
      fetch("/api/historial?" + q).then(r => r.json()),
      fetch("/api/ultimos").then(r => r.json()),
    ]);
    actualizarDispositivos(ult);
    pintar(hist, ult.find(u => u.dispositivo === dispositivo) || ult[0]);
  } catch (e) {
    setEstado("error", "Sin conexión con el servidor");
  }
}

function actualizarDispositivos(ult) {
  const sel = document.getElementById("dispositivo");
  const nombres = ult.map(u => u.dispositivo);
  if (!dispositivo && nombres.length) dispositivo = nombres[0];
  sel.hidden = nombres.length < 2;
  if (sel.options.length !== nombres.length) {
    sel.innerHTML = nombres.map(n => `<option>${n}</option>`).join("");
    sel.value = dispositivo;
  }
}

function setEstado(tipo, txt) {
  document.getElementById("punto").className = "punto " + tipo;
  document.getElementById("estadoTxt").textContent = txt;
}

function pintar(hist, ultima) {
  const tiles = document.getElementById("tiles"), charts = document.getElementById("charts");
  if (!ultima) {
    setEstado("viejo", "Esperando datos");
    tiles.innerHTML = `<div class="vacio" style="grid-column:1/-1">Todavía no hay lecturas. Cuando la ESP32 envíe datos a <code>/api/datos</code> aparecerán aquí.</div>`;
    return;
  }
  const t = Date.parse(ultima.ts), seg = (Date.now() - t) / 1000;
  setEstado(seg < 60 ? "ok" : "viejo", (seg < 60 ? "En línea · " : "Última lectura · ") + fmtFecha(t));

  const orden = Object.keys(SENSORES);
  const claves = Object.keys(ultima.datos).sort((a, b) =>
    (orden.includes(a) ? orden.indexOf(a) : 99) - (orden.includes(b) ? orden.indexOf(b) : 99) || a.localeCompare(b));
  // Tarjetas con el valor actual
  tiles.innerHTML = claves.map(k => {
    const s = info(k), v = ultima.datos[k];
    if (s.binario) {
      const on = Number(v) === 1;
      return `<div class="tile"><div class="lbl">${s.nombre}</div>
        <div class="bin"><span class="punto ${on ? "viejo" : "ok"}"></span>${s.binario[on ? 1 : 0]}</div></div>`;
    }
    return `<div class="tile"><div class="lbl">${s.nombre}</div>
      <div class="val">${Number(v).toFixed(s.dec)}<small>${s.unidad}</small></div></div>`;
  }).join("");

  // Una gráfica por sensor (cada una con su propio eje)
  for (const k of claves) {
    const s = info(k);
    const puntos = hist.filter(h => k in h.datos).map(h => ({ x: Date.parse(h.ts), y: h.datos[k] }));
    if (!graficas[k]) crearGrafica(k, s);
    const g = graficas[k];
    g.data.datasets[0].data = puntos;
    g.options.scales.x.min = Date.now() - horas * 3600e3;
    g.options.scales.x.max = Date.now();
    g.options.scales.x.ticks.stepSize = horas * 3600e3 / 4;
    g.update("none");
  }
  for (const k of Object.keys(graficas)) if (!claves.includes(k)) { graficas[k].destroy(); document.getElementById("card-" + k).remove(); delete graficas[k]; }

  // Tabla con las últimas 20 lecturas
  const ult20 = hist.slice(-20).reverse();
  document.getElementById("tabla").innerHTML =
    `<tr><th>Hora</th>${claves.map(k => `<th>${info(k).nombre}</th>`).join("")}</tr>` +
    ult20.map(h => `<tr><td>${fmtFecha(Date.parse(h.ts))}</td>${claves.map(k => `<td>${h.datos[k] ?? "—"}</td>`).join("")}</tr>`).join("");
}

function crearGrafica(k, s) {
  const card = document.createElement("div");
  card.className = "card"; card.id = "card-" + k;
  card.innerHTML = `<h2>${s.nombre}${s.unidad ? ` (${s.unidad})` : ""}</h2><div class="cv"><canvas></canvas></div>`;
  document.getElementById("charts").appendChild(card);
  const color = css("--series-1");
  graficas[k] = new Chart(card.querySelector("canvas"), {
    type: "line",
    data: { datasets: [{
      data: [], borderColor: color, backgroundColor: color + "22", borderWidth: 2,
      pointRadius: 0, pointHoverRadius: 5, pointHoverBorderWidth: 2, pointHoverBorderColor: css("--surface-1"),
      clip: 4, tension: s.binario ? 0 : 0.25, stepped: s.binario ? "before" : false, fill: !!s.binario,
    }]},
    options: {
      responsive: true, maintainAspectRatio: false, animation: false, parsing: false,
      interaction: { mode: "nearest", axis: "x", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: css("--surface-1"), titleColor: css("--text-secondary"), bodyColor: css("--text-primary"),
          borderColor: css("--border"), borderWidth: 1, displayColors: false, padding: 10,
          callbacks: {
            title: it => fmtFecha(it[0].parsed.x),
            label: it => s.binario ? s.binario[it.parsed.y ? 1 : 0] : `${it.parsed.y.toFixed(s.dec)} ${s.unidad}`,
          },
        },
      },
      scales: {
        x: { type: "linear", grid: { display: false }, border: { color: css("--border") },
             ticks: { color: css("--text-muted"), maxTicksLimit: 5, maxRotation: 0, callback: v => fmtHora(v) } },
        y: { grid: { color: css("--grid") }, border: { display: false },
             ticks: { color: css("--text-muted"), maxTicksLimit: 5,
                      ...(s.binario ? { stepSize: 1, autoSkip: false, callback: v => (s.corto || ["0", "1"])[v] ?? "" } : {}) },
             ...(s.binario ? { min: 0, max: 1 } : {}) },
      },
    },
  });
}

document.getElementById("rango").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  document.querySelectorAll("#rango button").forEach(x => x.setAttribute("aria-pressed", x === b));
  horas = Number(b.dataset.h); cargar();
});
document.getElementById("dispositivo").addEventListener("change", e => {
  dispositivo = e.target.value;
  Object.values(graficas).forEach(g => g.destroy()); graficas = {};
  document.getElementById("charts").innerHTML = ""; cargar();
});

// Instalación como app en Android (PWA)
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");
let avisoInstalar;
window.addEventListener("beforeinstallprompt", e => {
  e.preventDefault(); avisoInstalar = e;
  document.getElementById("instalar").style.display = "inline-block";
});
document.getElementById("instalar").addEventListener("click", async () => {
  if (!avisoInstalar) return;
  avisoInstalar.prompt(); await avisoInstalar.userChoice;
  avisoInstalar = null; document.getElementById("instalar").style.display = "none";
});

cargar();
setInterval(cargar, REFRESCO_MS);
</script>
</body>
</html>
